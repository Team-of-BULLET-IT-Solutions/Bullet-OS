name: Build Bullet-OS GSI Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build Target'
        required: true
        default: 'bullet_arm64-userdebug'
        type: choice
        options:
          - 'bullet_arm64-userdebug'
          - 'bullet_x86_64-userdebug'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bullet-OS Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Set up Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 ccache openjdk-17-jdk

      - name: Build System Image Placeholder
        run: |
          echo "Simulating compile pipeline for ${{ github.event.inputs.target }}..."
          chmod +x build/envsetup.sh
          bash build/envsetup.sh
